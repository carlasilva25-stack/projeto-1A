<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header {
            background-color: aquamarine;
            color: darkblue;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            border: 5px solid white;
            padding: 16px;
        }
        main {
            background-color: black;
            color: aliceblue;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            p.autor {
                font-weight: bold;
            }
        }
        img {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <header>
  <h1>site do 1A</h1>
  <p>aprenda a fazer um site</p>  
    </header>
    <main>
        <img src="Gemini_Generated_Image_dozix2dozix2dozi.png" alt="Imagem da aula de educação digital">
        <div>
        <h2>Educação digital</h2>
        <p class="autor">POR: CARLA VOTÓRIA</p>
        <p>este site é para aula de educação digital do 1A</p>
        <button>😇<span>0</span></button>
        </div>
    </main>
</body>
<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado);
    function botaoClicado () {
        let texto = botao.querySelector("span");
        texto.textContent++;
    }
</script>
</html>
